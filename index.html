<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<meta name="description" content="Touch down on the Moon for the Logan's Run Quote Challenge.">
<title>Quote Challenge | On the Moon</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#02040a;color:#fff;font-family:system-ui,Arial,sans-serif}
body{padding-bottom:24px}
.moon-stage{position:relative;width:100%;max-width:1648px;aspect-ratio:1648/928;margin:0 auto;background:radial-gradient(circle at 50% 25%,#132548 0%,#060b18 58%,#02040a 100%);overflow:hidden}
/* Optional: if you have your own moon background image, remove the <svg class="moon-backdrop"> below and uncomment this:
.moon-stage{background:#02040a url('moon-stage.png') center/100% 100% no-repeat}
*/
.moon-backdrop{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.door-link{position:absolute;display:block;top:43.3%;height:43.8%;z-index:2;cursor:pointer;border-radius:14px;transition:box-shadow .2s ease,background-color .2s ease}
.door-one{left:32.5%;width:14.4%}
.door-two{left:52.9%;width:13.8%}
.door-link:hover,.door-link:focus-visible{background-color:#7fd4ff18;box-shadow:0 0 22px #7fd4ff55,inset 0 0 18px #ffdf8444}
.door-link::after{content:attr(data-label);position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:max-content;max-width:98%;padding:4px 7px;border:1px solid #9be2ff;border-radius:6px;background:#060d1ce6;color:#ffdf84;font-size:clamp(8px,1.1vw,14px);font-weight:800;letter-spacing:.06em;text-align:center;white-space:nowrap;opacity:0;transition:opacity .18s ease}
.door-link:hover::after,.door-link:focus-visible::after{opacity:1}
.door-link:focus-visible{outline:3px solid #fff39b;outline-offset:2px}
.below-stage{position:relative;width:min(1500px,96%);margin:18px auto 0;padding:14px;display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);gap:16px;align-items:stretch;border:1px solid #8bb9e077;border-radius:24px;background:radial-gradient(ellipse 85% 75% at 72% 4%,#3b75c044,transparent 72%),linear-gradient(180deg,#12243f 0%,#060e1d 48%,#02050c 100%);box-shadow:0 12px 36px #000b,inset 0 1px #ffffff20}
.navigation,.viewer-panel{position:relative;isolation:isolate;overflow:hidden;min-width:0;border:1px solid #8bb9e077;border-radius:22px;background:radial-gradient(ellipse 110% 52% at 72% 16%,#3f7ab94a,transparent 72%),linear-gradient(160deg,#0f1f38,#040913 76%);box-shadow:0 8px 28px #0009,inset 0 1px #ffffff20}
.navigation{padding:18px}
.navigation h2,.viewer-panel h2{margin:0 0 12px;color:#ffdf84;font-size:20px}
.navigation p{margin:0 0 14px;color:#c8d1e4;font-size:14px;line-height:1.5}
.nav-links{display:grid;gap:10px}
.nav-links a{display:block;padding:12px 14px;border:1px solid #92c4e077;border-radius:12px;background:linear-gradient(180deg,#517ca856 0%,#1b3c63 12%,#10233e 54%,#07152a 100%);box-shadow:inset 0 1px 1px #e7f7ff77,inset 0 -8px 14px #0005;color:#ffe7a0;text-decoration:none;font-weight:700;transition:background .18s ease,transform .18s ease,border-color .18s ease}
.nav-links a:hover,.nav-links a:focus-visible,.picture-slot:hover,.picture-slot:focus-visible{background:linear-gradient(180deg,#527ba6,#234d7c 40%,#0b2447);border-color:#b5e2ff;box-shadow:inset 0 1px 2px #e7f7ff99,0 0 14px #72bbff33}
.nav-links a:hover,.nav-links a:focus-visible{transform:translateX(2px)}
.nav-links a:focus-visible,.picture-slot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.picture-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
.picture-slot{padding:9px 4px;border:1px solid #92c4e077;border-radius:12px;background:linear-gradient(180deg,#517ca856 0%,#1b3c63 12%,#10233e 54%,#07152a 100%);color:#ffe7a0;font:700 13px/1.3 system-ui,Arial,sans-serif;cursor:pointer;transition:background .18s ease,border-color .18s ease}
.viewer-panel{display:flex;flex-direction:column;padding:18px}
.viewer-panel h2{margin-bottom:10px}
.viewer-panel iframe{display:block;flex:1;width:100%;min-height:560px;border:1px solid #8ab7e088;border-radius:14px;background:#03050b;box-shadow:inset 0 0 15px #000,0 0 0 1px #0008,0 6px 16px #0008}
@media(max-width:700px){.below-stage{grid-template-columns:1fr;margin-top:12px}.navigation{padding:14px}.nav-links{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-panel{min-height:520px;padding:14px}}
@media(max-width:420px){.nav-links{grid-template-columns:1fr}.viewer-panel{min-height:440px}.viewer-panel iframe{min-height:380px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

        <circle cx="130" cy="310" r="1.5"/><circle cx="285" cy="380" r="1.2"/><circle cx="1370" cy="295" r="1.8"/>
        <circle cx="1510" cy="365" r="1.4"/><circle cx="70" cy="480" r="1.6"/><circle cx="1585" cy="490" r="1.9"/>
        <circle cx="390" cy="230" r="1.3"/><circle cx="1210" cy="215" r="1.5"/>
      </g>

      <!-- Earth in the lunar sky -->
      <circle cx="220" cy="195" r="78" fill="#4faeff" opacity="0.18"/>
      <circle cx="220" cy="195" r="62" fill="url(#earthGlow)"/>
      <path d="M180 165c18-10 38-6 46 8 6 11-5 24 6 33 10 8 24 3 32 14-8 16-24 27-44 29-18-5-34-18-42-37-4-16-2-33 2-47z" fill="#b7f0ff" opacity="0.45"/>

      <!-- Distant lunar ridge -->
      <path d="M0 680 Q190 610 390 665 T824 640 T1280 670 T1648 635 L1648 928 L0 928 Z" fill="#323b4a"/>

      <!-- Main lunar surface -->
      <path d="M0 735 Q280 700 540 730 T1120 725 T1648 740 L1648 928 L0 928 Z" fill="url(#moonGround)"/>

      <!-- Lunar craters -->
      <g opacity="0.7">
        <ellipse cx="185" cy="825" rx="95" ry="26" fill="#272e3b" stroke="#8e9aad" stroke-width="2"/>
        <ellipse cx="1430" cy="818" rx="115" ry="30" fill="#272e3b" stroke="#8e9aad" stroke-width="2"/>
        <ellipse cx="420" cy="875" rx="58" ry="14" fill="#222834" stroke="#7c8799" stroke-width="1.5"/>
        <ellipse cx="1220" cy="878" rx="64" ry="16" fill="#222834" stroke="#7c8799" stroke-width="1.5"/>
        <ellipse cx="824" cy="885" rx="90" ry="18" fill="#202632" stroke="#7c8799" stroke-width="1.5"/>
      </g>

      <!-- Lunar Quote Outpost Dome -->
      <path d="M405 815 C405 330, 1243 330, 1243 815 Z" fill="url(#domeShell)" stroke="#8ad3ff" stroke-width="3"/>
      <path d="M470 815 C470 400, 1178 400, 1178 815" fill="none" stroke="#8ad3ff" stroke-opacity="0.28" stroke-width="2"/>
      <path d="M620 815 C620 445, 1028 445, 1028 815" fill="none" stroke="#8ad3ff" stroke-opacity="0.22" stroke-width="2"/>
      <line x1="824" y1="365" x2="824" y2="815" stroke="#8ad3ff" stroke-opacity="0.22" stroke-width="2"/>

      <!-- Outpost base platform -->
      <rect x="370" y="805" width="908" height="24" rx="10" fill="#18253b" stroke="#7ab8e8" stroke-width="2"/>

      <!-- Marquee sign on lunar dome -->
      <rect x="574" y="295" width="500" height="62" rx="14" fill="#071224" stroke="#ffdf84" stroke-width="3"/>
      <text x="824" y="335" text-anchor="middle" fill="#ffdf84" font-family="system-ui,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="3">THE QUOTE GAME • MOON BASE</text>

      <!-- Airlock 1 (aligned behind .door-one) -->
      <rect x="536" y="402" width="237" height="406" rx="18" fill="url(#airlockGlow)" stroke="#9be2ff" stroke-width="3"/>
      <rect x="556" y="424" width="197" height="362" rx="12" fill="none" stroke="#ffdf84" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="654" cy="545" r="46" fill="#08152b" stroke="#9be2ff" stroke-width="2.5"/>
      <text x="654" y="556" text-anchor="middle" fill="#ffdf84" font-family="system-ui,Arial,sans-serif" font-size="32" font-weight="800">1P</text>
      <text x="654" y="645" text-anchor="middle" fill="#d9f0ff" font-family="system-ui,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">SOLO POD</text>

      <!-- Airlock 2 (aligned behind .door-two) -->
      <rect x="872" y="402" width="227" height="406" rx="18" fill="url(#airlockGlow)" stroke="#9be2ff" stroke-width="3"/>
      <rect x="892" y="424" width="187" height="362" rx="12" fill="none" stroke="#ffdf84" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="985" cy="545" r="46" fill="#08152b" stroke="#9be2ff" stroke-width="2.5"/>
      <text x="985" y="556" text-anchor="middle" fill="#ffdf84" font-family="system-ui,Arial,sans-serif" font-size="32" font-weight="800">2P</text>

    <a class="door-link door-two" href="two-player.html" target="mainViewer" aria-label="Open two-player game in the main viewing panel" title="Lunar Bay 2 — Two-Player Challenge" data-label="LUNAR BAY 2 (DUO)"></a>

  <div class="below-stage">
    <nav class="navigation" aria-label="Site pages">

        <a href="home-panel.html" target="mainViewer" class="feature-slot">Second Home</a>
        <a href="Creatos.html" target="mainViewer" class="feature-slot">Meet Creatos</a>
        <a href="fastrounde.html" target="mainViewer" class="feature-slot">Impossible Five</a>
        <a href="#" target="mainViewer" class="feature-slot">Feature 09</a>
        <a href="#" target="mainViewer" class="feature-slot">Feature 10</a>

      <h2 style="margin-top:20px">Picture projector</h2>
      <div class="picture-links" aria-label="Picture shortcuts">
        <button type="button" class="picture-slot" data-image="logan-poster.png">Logan's Run poster</button>

    <section class="viewer-panel" aria-labelledby="viewerTitle">

</main>
<script>
'use strict';

const mainViewer = document.querySelector('iframe[name="mainViewer"]');
const viewerPanel = document.querySelector('.viewer-panel');

function showViewerMessage(title, message){
  const doc = document.implementation.createHTMLDocument(title);
  const style = doc.createElement('style');
  style.textContent = 'body{margin:0;min-height:100vh;background:#03050b;color:#ffe7a0;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;text-align:center}main{padding:24px;width:min(680px,100%)}h1{color:#ffdf84}p{color:#c8d1e4;line-height:1.6}';
  doc.head.append(style);
  const main = doc.createElement('main');
  const heading = doc.createElement('h1');
  heading.textContent = title;
  const paragraph = doc.createElement('p');
  paragraph.textContent = message;
  main.append(heading, paragraph);
  doc.body.append(main);
  mainViewer.removeAttribute('src');
  mainViewer.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
}

function projectPicture(title, imagePath){
  const doc = document.implementation.createHTMLDocument(title);
  const style = doc.createElement('style');
  style.textContent = 'body{margin:0;min-height:100vh;background:#03050b;color:#ffe7a0;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;text-align:center}main{padding:18px;width:100%;height:100vh;display:grid;place-items:center}img{max-width:100%;max-height:calc(100vh - 36px);object-fit:contain}p{padding:16px}';
  doc.head.append(style);
  const main = doc.createElement('main');
  const img = doc.createElement('img');
  img.alt = title;
  img.src = new URL(imagePath, location.href).href;
  img.addEventListener('error', () => {
    const message = doc.createElement('p');
    message.textContent = 'Picture not found: ' + imagePath;
    img.replaceWith(message);
  });
  main.append(img);
  doc.body.append(main);
  mainViewer.removeAttribute('src');
  mainViewer.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
}

document.querySelectorAll('.picture-slot').forEach(button => {
  button.addEventListener('click', () => {
    const filename = button.dataset.image.trim();
    if (!filename) {
      showViewerMessage(button.textContent.trim(), 'Add an image filename to this picture button to use it.');
    } else {
      projectPicture(button.textContent.trim(), filename);
    }
    viewerPanel.scrollIntoView({behavior:'smooth',block:'start'});
  });
});

// Keep unassigned feature slots in the moonscreen instead of navigating to the page top.
document.querySelectorAll('a[target="mainViewer"]').forEach(link => {
  link.addEventListener('click', event => {
    const href = link.getAttribute('href');
    if (!href || href === '#') {
      event.preventDefault();
      showViewerMessage(link.textContent.trim() || 'Feature coming soon', 'This lunar module is ready. Choose another feature or check back later.');
      viewerPanel.scrollIntoView({behavior:'smooth',block:'start'});
      return;
    }
    // Clear projected picture/message content so the iframe can navigate normally.
    mainViewer.removeAttribute('srcdoc');
  });
});
</script>
</body>
