<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>QUOTE CHALLENGE</title>
<style>
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 40px;
  }

  /* Control bar to test live text editing */
  .controls input {
    width: 320px;
    padding: 8px 12px;
    font-size: 16px;
    border-radius: 4px;
    border: 1px solid #00b4d8;
    background: #0a192f;
    color: #b8f4ff;
  }

  /* Theater entrance wrapper */
  .theater-entrance {
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    background: #1c2541; /* Fallback preview background if image isn't linked yet */
    overflow: hidden;
  }

  .entrance-bg {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Marquee slot positioned over the upper sign */
  .marquee-slot {
    position: absolute;
    top: 13.5%;
    left: 29.8%;
    width: 40.4%;
    height: 11.8%;
    display: flex;
    align-items: center;
    overflow: hidden;
    border-radius: 6px;
    background: radial-gradient(ellipse at center, rgba(6, 20, 48, 0.85) 0%, rgba(2, 8, 22, 0.96) 100%);
    box-shadow: inset 0 0 14px rgba(0, 210, 255, 0.35);
    white-space: nowrap;
  }

  .marquee-track {
    display: inline-block;
    padding-left: 100%;
    font-family: 'Courier New', 'Consolas', monospace;
    font-weight: 700;
    font-size: clamp(1.1rem, 2.5vw, 2.3rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #b8f4ff;
    text-shadow:
      0 0 4px #ffffff,
      0 0 10px #4deeea,
      0 0 22px #00b4d8,
      0 0 38px #0077b6;
    animation: laser-scroll 10s linear infinite;
  }

  .marquee-slot:hover .marquee-track {
    animation-play-state: paused;
  }

  @keyframes laser-scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>

  <div class="controls">
    <label for="marqueeInput">Edit Marquee Text: </label>
    <input id="marqueeInput" type="text" value="LOGAN'S RUN" />
  </div>

  <div class="theater-entrance">
    <!-- Replace src with your saved entrance image filename -->
    <img src="your-cleared-entrance.png" alt="Theater Entrance" class="entrance-bg" onerror="this.style.display='none'" />
    <div class="marquee-slot">
      <div class="marquee-track" id="marqueeText">LOGAN'S RUN THE FURTURE IS SET THE CLOCK IS TICKING YOUR PALM OS RED TIME TO RUN!!!/div>
    </div>
  </div>

  <script>
    const input = document.getElementById('marqueeInput');
    const track = document.getElementById('marqueeText');

    input.addEventListener('input', () => {
      track.textContent = input.value || ' ';
    });
  </script>

</body>
</html>
